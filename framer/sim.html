<!doctype html>
<!-- ragtooth/framer/sim.html — Framer-less simulator for the Ragtooth code component.
     Renders the REAL src/framer/Ragtooth.tsx (transpiled to Ragtooth.sim.mjs) in a plain
     browser, with the "framer" import mapped to a local shim and React from esm.sh. This proves
     the component's runtime logic (rendering, applyRag, ResizeObserver re-layout) outside Framer.
     Build step: npx esbuild src/framer/Ragtooth.tsx --loader:.tsx=tsx --format=esm
       --jsx=automatic --jsx-import-source=react --outfile=framer/Ragtooth.sim.mjs -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Ragtooth — Framer component simulator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet" />
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e12; color: #f4f4f6; padding: 4rem 6vw; }
		#root { width: 100%; max-width: 34ch; }
		.note { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font: 0.8rem system-ui; opacity: 0.5; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"react": "https://esm.sh/react@18",
			"react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
			"react-dom/client": "https://esm.sh/react-dom@18/client",
			"framer": "./framer-shim.js"
		}
	}
	</script>
</head>
<body>
	<div id="root"></div>
	<p class="note">Simulating the Framer code component in a plain browser — RenderTarget shimmed to 'preview'.</p>
	<script type="module">
		import React from "react"
		import { createRoot } from "react-dom/client"
		import Ragtooth from "./Ragtooth.sim.mjs"
		createRoot(document.getElementById("root")).render(
			React.createElement(Ragtooth, {
				text: "Deliberate sawtooth rag gives a block of type a quiet, engineered edge that a browser's greedy wrap never achieves on its own — the ragged margin becomes a repeating figure rather than accidental noise.",
				fontFamily: "Fraunces",
				fontSize: 28,
				color: "#f4f4f6",
				textAlign: "left",
				sawDepth: 90,
				sawPeriod: 2,
				maxTracking: 0.7,
				sawPhase: 2,
				sawAlign: "top",
				resize: true,
			})
		)
	</script>
</body>
</html>
